<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dakhila Admin - Secured</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root { --primary-blue: #326AFD; --accent-green: #D1FC57; --accent-purple: #BB7BFF; --charcoal: #1E1E24; --bg-color: #F4F6F9; --white: #FFFFFF; --text-dark: #1E1E24; --text-light: #8A8B9F; --danger: #FF4D4D; }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Roboto', sans-serif; background-color: var(--bg-color); color: var(--text-dark); margin: 0; padding: 0; font-size: 15px; }

        /* Reuse previous CSS for Header, Grid, Modals etc. (Compressed for brevity) */
        header { background: var(--white); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 20px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 100; }
        .brand { display: flex; align-items: center; gap: 12px; } .brand img { height: 36px; } .brand h1 { font-size: 20px; font-weight: 700; color: var(--primary-blue); margin: 0; }
        .container { max-width: 1400px; margin: 30px auto; padding: 0 5%; }
        .controls-bar { display: flex; justify-content: space-between; margin-bottom: 25px; gap: 15px; flex-wrap: wrap; }
        .search-input { width: 100%; padding: 14px 15px 14px 45px; border: 2px solid transparent; border-radius: 12px; background: var(--white); box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .btn { padding: 12px 20px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; color:white; }
        .btn-primary { background-color: var(--primary-blue); } .btn-success { background-color: var(--accent-green); color: var(--charcoal); }
        .btn-refresh { background-color: var(--white); color: var(--primary-blue); border: 2px solid var(--primary-blue); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: var(--white); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .card-header { display: flex; justify-content: space-between; margin-bottom: 12px; } .uni-name { font-size: 17px; font-weight: 700; }
        .badge { font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 20px; } .badge-private { background: #FDE8E8; color: #D63031; } .badge-public { background: #E8F6EF; color: #27AE60; }
        .uni-meta { font-size: 13px; color: var(--text-light); margin-bottom: 20px; } .card-actions { margin-top: auto; display: flex; gap: 8px; padding-top: 15px; border-top: 1px solid #f0f0f0; }
        .btn-card { flex: 1; justify-content: center; padding: 8px; font-size: 12px; border-radius: 8px; } .btn-purple { background: var(--accent-purple); } .btn-edit { background: #F0F2F5; color: var(--charcoal); } .btn-delete { background: #FFF0F0; color: var(--danger); }

        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(30,30,36,0.7); backdrop-filter: blur(3px); z-index: 1000; display: none; justify-content: center; align-items: center; padding: 20px; opacity: 0; transition: opacity 0.3s; }
        .modal { background: var(--white); width: 100%; max-width: 550px; border-radius: 16px; padding: 25px; transform: translateY(20px); transition: transform 0.3s; max-height: 90vh; display: flex; flex-direction: column; }
        .modal-lg { max-width: 800px; } .modal.show { transform: translateY(0); } .modal-overlay.show { opacity: 1; }
        .form-control { width: 100%; padding: 12px; border: 2px solid #EEE; border-radius: 8px; margin-bottom: 15px; background: #FAFAFA; }
        .hidden { display: none !important; } .show { display: flex !important; opacity: 1 !important; }

        /* AUTH MODAL SPECIFIC */
        #authModal { z-index: 3000; }
        #authModal .modal { max-width: 400px; text-align: center; }
    </style>
</head>
<body>

<div id="loadingOverlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:2000; display:flex; justify-content:center; align-items:center; flex-direction:column;">
    <div style="font-weight:500; color:var(--primary-blue);">Connecting...</div>
</div>

<div id="authModal" class="modal-overlay show">
    <div class="modal">
        <h2 style="margin-top:0; color:var(--primary-blue);">🔐 Admin Access</h2>
        <p style="color:var(--text-light);">Enter your Render API Key to manage data.</p>
        <input type="password" id="apiKeyInput" class="form-control" placeholder="Enter API Key...">
        <button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="saveApiKey()">Login</button>
    </div>
</div>

<header>
    <div class="brand"><img src="logo.png" onerror="this.style.display='none'" height="36"> <h1>ADMIN PANEL</h1></div>
    <div style="display:flex; gap:10px;">
        <button class="btn btn-edit" onclick="logout()">Logout</button>
        <button class="btn btn-primary" onclick="openUniversityModal()">+ Add University</button>
    </div>
</header>

<div class="container">
    <div class="controls-bar">
        <input type="text" id="searchInput" class="search-input" style="max-width:400px;" placeholder="Search..." onkeyup="filterUniversities()">
        <button class="btn btn-refresh" onclick="fetchData()">Refresh</button>
    </div>
    <div id="universityGrid" class="grid"></div>
</div>

<div id="universityModal" class="modal-overlay"><div class="modal"><h3 id="uniModalTitle">Add University</h3><div style="overflow-y:auto;"><input type="hidden" id="uniId"><input class="form-control" id="uniName" placeholder="Name"><input class="form-control" id="uniLocation" placeholder="Location"><select class="form-control" id="uniSector"><option>Public</option><option>Private</option></select><input class="form-control" id="uniWebsite" placeholder="Website"><input class="form-control" id="uniLogo" placeholder="Logo URL"><input class="form-control" id="uniPhone" placeholder="Phone"><input class="form-control" id="uniEmail" placeholder="Email"><button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="saveUniversity()">Save</button><button class="btn btn-edit" style="width:100%; margin-top:10px; justify-content:center;" onclick="closeModal('universityModal')">Cancel</button></div></div></div>

<div id="programsModal" class="modal-overlay"><div class="modal modal-lg"><h3>Manage Programs: <span id="currentUniName"></span></h3><div style="flex:1; overflow-y:auto; padding:5px;"><div style="background:#F4F6F9; padding:15px; border-radius:10px; margin-bottom:15px;"><input type="hidden" id="progIndex"><input class="form-control" id="progName" placeholder="Program Name"><div style="display:flex; gap:10px;"><input class="form-control" id="progMerit" type="number" placeholder="Min %"><input class="form-control" id="progDuration" placeholder="Duration"></div><div style="display:flex; gap:10px;"><input class="form-control" id="progDeadline" placeholder="Deadline"><input class="form-control" id="progTags" placeholder="Tags (comma separated)"></div><button class="btn btn-success" onclick="pushProgramToLocal()" style="width:100%;">Add/Update to List</button></div><div id="programsListContainer"></div></div><button class="btn btn-primary" onclick="commitProgramsToBackend()" style="width:100%; margin-top:10px; justify-content:center;">Save All Changes</button><button class="btn btn-edit" onclick="closeModal('programsModal')" style="width:100%; margin-top:10px; justify-content:center;">Close</button></div></div>

<script>
    // 🚨 CONFIG 🚨
    const API_BASE = "https://dakhla-unity-api.onrender.com/api/universities";

    let allUniversities = [];
    let currentUniForPrograms = null;
    let ADMIN_KEY = localStorage.getItem("dakhla_api_key");

    window.onload = () => {
        if(ADMIN_KEY) {
            document.getElementById('authModal').classList.remove('show');
            fetchData();
        } else {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }
    };

    function saveApiKey() {
        const input = document.getElementById('apiKeyInput').value;
        if(!input) return alert("Please enter key");
        localStorage.setItem("dakhla_api_key", input);
        ADMIN_KEY = input;
        document.getElementById('authModal').classList.remove('show');
        fetchData();
    }

    function logout() {
        localStorage.removeItem("dakhla_api_key");
        location.reload();
    }

    async function fetchData() {
        document.getElementById('loadingOverlay').classList.remove('hidden');
        try {
            // GET requests don't need the key (as per server.js logic),
            // but we can send it anyway or leave it out.
            const res = await fetch(API_BASE);
            if(!res.ok) throw new Error("Fetch failed");
            allUniversities = await res.json();
            renderGrid(allUniversities);
        } catch(e) { console.error(e); }
        document.getElementById('loadingOverlay').classList.add('hidden');
    }

    // --- Generic Save Function with AUTH Header ---
    async function sendRequest(url, method, body) {
        try {
            const res = await fetch(url, {
                method: method,
                headers: {
                    "Content-Type": "application/json",
                    "x-api-key": ADMIN_KEY // 🔑 SENDING THE KEY HERE
                },
                body: JSON.stringify(body)
            });

            if(res.status === 403) {
                alert("⛔ Access Denied: Invalid API Key. Please logout and enter the correct key.");
                return false;
            }
            if(!res.ok) throw new Error("Server Error");
            return true;
        } catch(e) {
            alert("Network Error: " + e.message);
            return false;
        }
    }

    // --- University CRUD ---
    async function saveUniversity() {
        const id = document.getElementById('uniId').value;
        const name = document.getElementById('uniName').value;
        if(!name) return alert("Name required");

        const uniObj = {
            name,
            location: document.getElementById('uniLocation').value,
            sector: document.getElementById('uniSector').value,
            websiteUrl: document.getElementById('uniWebsite').value,
            logoUrl: document.getElementById('uniLogo').value,
            contactPhone: document.getElementById('uniPhone').value,
            contactEmail: document.getElementById('uniEmail').value,
            programs: id ? allUniversities.find(u=>u.id===id).programs : [],
            id: id || name.toLowerCase().replace(/[^a-z0-9]/g, '-') + "-" + Date.now().toString().slice(-4)
        };

        const url = id ? `${API_BASE}/${id}` : API_BASE;
        const method = id ? "PUT" : "POST";

        const success = await sendRequest(url, method, uniObj);
        if(success) { closeModal('universityModal'); fetchData(); }
    }

    async function deleteUniversity(id) {
        if(!confirm("Delete?")) return;
        const success = await sendRequest(`${API_BASE}/${id}`, "DELETE", null);
        if(success) fetchData();
    }

    async function commitProgramsToBackend() {
        if(!currentUniForPrograms) return;
        const success = await sendRequest(`${API_BASE}/${currentUniForPrograms.id}`, "PUT", currentUniForPrograms);
        if(success) { closeModal('programsModal'); fetchData(); }
    }

    // --- UI Helpers (Same as before, minified for space) ---
    function renderGrid(d){const g=document.getElementById('universityGrid');g.innerHTML="";d.forEach(u=>{g.innerHTML+=`<div class="card"><div class="card-header"><h3>${u.name}</h3><span class="badge">${u.sector||''}</span></div><div class="card-actions"><button class="btn btn-purple btn-card" onclick='openProgramsModal("${u.id}")'>Programs</button><button class="btn btn-edit btn-card" onclick='openEditUniModal("${u.id}")'>Edit</button><button class="btn btn-delete btn-card" onclick='deleteUniversity("${u.id}")'>Del</button></div></div>`});}
    function filterUniversities(){const q=document.getElementById('searchInput').value.toLowerCase();renderGrid(allUniversities.filter(u=>u.name.toLowerCase().includes(q)));}
    function openUniversityModal(){clearUniForm();openModal('universityModal');}
    function openEditUniModal(id){const u=allUniversities.find(x=>x.id===id);if(!u)return;document.getElementById('uniId').value=u.id;document.getElementById('uniName').value=u.name;document.getElementById('uniLocation').value=u.location;document.getElementById('uniSector').value=u.sector;document.getElementById('uniWebsite').value=u.websiteUrl;document.getElementById('uniLogo').value=u.logoUrl||"";document.getElementById('uniPhone').value=u.contactPhone||"";document.getElementById('uniEmail').value=u.contactEmail||"";openModal('universityModal');}
    function clearUniForm(){document.getElementById('uniId').value="";document.getElementById('uniName').value="";document.getElementById('uniLocation').value="";document.getElementById('uniLogo').value="";}

    function openProgramsModal(id){currentUniForPrograms=JSON.parse(JSON.stringify(allUniversities.find(u=>u.id===id)));document.getElementById('currentUniName').innerText=currentUniForPrograms.name;renderProgs();clearProgForm();openModal('programsModal');}
    function renderProgs(){const c=document.getElementById('programsListContainer');c.innerHTML="";(currentUniForPrograms.programs||[]).forEach((p,i)=>{c.innerHTML+=`<div style="background:#EEE; padding:10px; margin-bottom:5px; border-radius:6px; display:flex; justify-content:space-between;"><div><b>${p.name}</b><br><small>${p.minRequiredPercentage}% | ${p.deadline||''}</small></div><div><button onclick="loadProg(${i})">Edit</button><button onclick="delProg(${i})">X</button></div></div>`});}
    function pushProgramToLocal(){const idx=document.getElementById('progIndex').value;const name=document.getElementById('progName').value;if(!name)return;const p={programId:idx>=0?currentUniForPrograms.programs[idx].programId:Date.now().toString(),name,minRequiredPercentage:document.getElementById('progMerit').value,duration:document.getElementById('progDuration').value,applicationDeadline:document.getElementById('progDeadline').value,streamTags:document.getElementById('progTags').value.split(',')};if(idx>=0)currentUniForPrograms.programs[idx]=p;else{if(!currentUniForPrograms.programs)currentUniForPrograms.programs=[];currentUniForPrograms.programs.push(p);}renderProgs();clearProgForm();}
    function loadProg(i){const p=currentUniForPrograms.programs[i];document.getElementById('progIndex').value=i;document.getElementById('progName').value=p.name;document.getElementById('progMerit').value=p.minRequiredPercentage;document.getElementById('progDuration').value=p.duration;document.getElementById('progDeadline').value=p.applicationDeadline;document.getElementById('progTags').value=p.streamTags?p.streamTags.join(','):"";}
    function delProg(i){currentUniForPrograms.programs.splice(i,1);renderProgs();}
    function clearProgForm(){document.getElementById('progIndex').value="-1";document.getElementById('progName').value="";document.getElementById('progMerit').value="";document.getElementById('progTags').value="";}

    function openModal(id){document.getElementById(id).classList.add('show');}
    function closeModal(id){document.getElementById(id).classList.remove('show');}
</script>
</body>
</html>
