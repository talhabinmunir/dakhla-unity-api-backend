<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dakhla Admin Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <style>
        :root {
            /* Brand Colors */
            --primary-blue: #326AFD;
            --accent-green: #D1FC57;
            --accent-purple: #BB7BFF;

            /* Neutrals */
            --charcoal: #1E1E24;
            --bg-color: #F4F6F9;
            --white: #FFFFFF;
            --text-dark: #1E1E24;
            --text-light: #8A8B9F;
            --danger: #FF4D4D;
            --danger-bg: #FFE5E5;
            --border-color: #E0E0E0;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            font-size: 15px;
        }

        /* --- Header --- */
        header {
            background-color: var(--white);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 20px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand { display: flex; align-items: center; gap: 12px; }
        .brand img { height: 36px; width: auto; }
        .brand h1 { font-size: 22px; font-weight: 700; color: var(--primary-blue); margin: 0; letter-spacing: 0.5px; }

        /* --- Layout --- */
        .container { max-width: 1400px; margin: 30px auto; padding: 0 5%; }

        /* Controls Bar (Updated for Filters) */
        .controls-bar {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
            flex-wrap: wrap;
            background: var(--white);
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }

        .search-wrapper { flex: 2; position: relative; min-width: 250px; }
        .search-wrapper span { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--primary-blue); }

        .search-input {
            width: 100%; padding: 12px 15px 12px 45px;
            border: 2px solid #EEE; border-radius: 10px;
            background: #FAFAFA; font-size: 15px; transition: 0.3s;
        }
        .search-input:focus { border-color: var(--primary-blue); background: #FFF; }

        /* Filter Dropdowns */
        .filter-select {
            flex: 1;
            min-width: 160px;
            padding: 12px;
            border: 2px solid #EEE;
            border-radius: 10px;
            background: #FAFAFA;
            font-size: 14px;
            font-family: 'Roboto', sans-serif;
            color: var(--charcoal);
            cursor: pointer;
            transition: 0.3s;
        }
        .filter-select:hover { border-color: #CCC; }
        .filter-select:focus { border-color: var(--primary-blue); background: #FFF; }

        /* --- Buttons --- */
        .btn {
            padding: 12px 20px; border-radius: 10px; border: none;
            font-weight: 600; font-size: 14px; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            gap: 8px; transition: 0.2s; white-space: nowrap;
        }
        .btn:hover { transform: translateY(-2px); opacity: 0.95; }
        .btn:active { transform: translateY(0); }

        .btn-primary { background-color: var(--primary-blue); color: white; box-shadow: 0 4px 12px rgba(50, 106, 253, 0.25); }
        .btn-success { background-color: var(--accent-green); color: var(--charcoal); box-shadow: 0 4px 12px rgba(209, 252, 87, 0.3); }
        .btn-refresh { background-color: var(--bg-color); color: var(--text-dark); border: 1px solid #ddd; }

        /* Icon Buttons for Lists */
        .btn-icon { width: 40px; height: 40px; border-radius: 10px; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        .btn-edit-icon { background: #EEF2FF; color: var(--primary-blue); } .btn-edit-icon:hover { background: var(--primary-blue); color: white; transform: scale(1.05); }
        .btn-delete-icon { background: #FFF0F0; color: var(--danger); margin-left: 0; } .btn-delete-icon:hover { background: var(--danger); color: white; transform: scale(1.05); }

        /* --- Cards --- */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
        .card { background: var(--white); border-radius: 16px; padding: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.03); transition: 0.3s; display: flex; flex-direction: column; border: 1px solid transparent; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.08); border-color: rgba(50, 106, 253, 0.1); }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 10px; }
        .uni-name { font-size: 17px; font-weight: 700; color: var(--charcoal); margin: 0; line-height: 1.3; }
        .badge { font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 20px; text-transform: uppercase; }
        .badge-private { background: #FDE8E8; color: #D63031; } .badge-public { background: #E8F6EF; color: #27AE60; }
        .uni-meta { font-size: 13px; color: var(--text-light); margin-bottom: 20px; display: flex; flex-direction: column; gap: 6px; }
        .uni-meta div { display: flex; align-items: center; gap: 8px; }
        .uni-meta .icon { font-size: 16px; color: var(--primary-blue); }
        .card-actions { margin-top: auto; display: flex; gap: 8px; padding-top: 15px; border-top: 1px solid #f0f0f0; }
        .btn-card { flex: 1; padding: 8px; font-size: 12px; border-radius: 8px; }
        .btn-purple { background-color: var(--accent-purple); color: white; }
        .btn-edit { background-color: #F0F2F5; color: var(--charcoal); }
        .btn-delete { background-color: #FFF0F0; color: var(--danger); }

        /* --- Modals & Forms --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(30, 30, 36, 0.7); backdrop-filter: blur(3px); z-index: 1000; display: none; justify-content: center; align-items: center; padding: 20px; opacity: 0; transition: opacity 0.3s; }
        .modal { background: var(--white); width: 100%; max-width: 550px; border-radius: 16px; padding: 25px; transform: translateY(20px); transition: transform 0.3s; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .modal-lg { max-width: 800px; }
        .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
        .modal-title { font-size: 20px; font-weight: 700; color: var(--charcoal); margin: 0; }
        .close-btn { background: none; border: none; font-size: 28px; cursor: pointer; color: var(--text-light); padding: 0; margin-left: 10px; }
        .modal-body { overflow-y: auto; padding-right: 5px; flex: 1; }

        .form-group { margin-bottom: 15px; }
        .form-label { display: block; font-size: 12px; font-weight: 700; color: var(--charcoal); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-control { width: 100%; padding: 12px; border: 2px solid #EEE; border-radius: 8px; font-family: 'Roboto', sans-serif; font-size: 14px; background: #FAFAFA; transition: 0.3s; }
        .form-control:focus { border-color: var(--primary-blue); background: #FFF; }
        .row-group { display: flex; gap: 15px; }

        /* Program List */
        .program-edit-box { background: #F4F6F9; padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #EAEAEA; }
        .programs-list { display: flex; flex-direction: column; gap: 12px; }
        .program-item { background: #FFF; border: 1px solid #EEE; padding: 16px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; gap: 15px; transition: all 0.2s ease; }
        .program-item:hover { border-color: var(--primary-blue); box-shadow: 0 4px 15px rgba(0,0,0,0.05); transform: translateY(-2px); }
        .program-info { flex: 1; min-width: 0; }
        .program-info h4 { margin: 0 0 6px 0; font-size: 16px; font-weight: 600; color: var(--primary-blue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .program-info p { margin: 0; font-size: 13px; color: var(--text-light); line-height: 1.5; }
        .prog-actions { display: flex; flex-direction: row; gap: 10px; flex-shrink: 0; align-items: center; }
        .tag-pill { display: inline-block; background: var(--accent-green); color: var(--charcoal); padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; margin-right: 4px; margin-top: 6px; }

        /* Loading */
        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--white); z-index: 2000; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { width: 40px; height: 40px; border: 4px solid #EEE; border-top-color: var(--primary-blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; } .show { display: flex !important; opacity: 1 !important; } .show .modal { transform: translateY(0) !important; }
        @media (max-width: 768px) { .row-group { flex-direction: column; gap: 0; } .prog-grid-row { display: flex; flex-direction: column; gap: 0; } .program-item { flex-direction: column; align-items: flex-start; } .prog-actions { width: 100%; display: flex; justify-content: flex-end; margin-top: 10px; } .controls-bar { flex-direction: column; align-items: stretch; } }
    </style>
</head>
<body>

<div id="loadingOverlay">
    <div class="spinner"></div>
    <div style="font-weight: 500; color: var(--primary-blue);">Connecting to Dakhla Cloud...</div>
</div>

<div id="authModal" class="modal-overlay show" style="z-index: 3000;">
    <div class="modal" style="max-width: 400px; text-align: center;">
        <h2 style="margin-top:0; color:var(--primary-blue);">🔐 Admin Access</h2>
        <p style="color:var(--text-light); margin-bottom: 20px;">Enter your Render API Key to manage data.</p>
        <div class="form-group">
            <input type="password" id="apiKeyInput" class="form-control" placeholder="Enter API Key...">
        </div>
        <button class="btn btn-primary" style="width:100%;" onclick="saveApiKey()">Login</button>
    </div>
</div>

<header>
    <div class="brand">
        <img src="logo.png" alt="Dakhla Logo" onerror="this.style.display='none'">
        <h1>| DASHBOARD</h1>
    </div>
    <div style="display: flex; gap: 10px;">
        <button class="btn btn-edit" onclick="logout()" title="Logout">
            <span class="material-icons-round">logout</span>
        </button>
        <button class="btn btn-primary" onclick="openUniversityModal()">
            <span class="material-icons-round">add_circle</span> Add University
        </button>
    </div>
</header>

<div class="container">
    <div class="controls-bar">
        <div class="search-wrapper">
            <span class="material-icons-round">search</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Search by name..." onkeyup="applyFilters()">
        </div>

        <select id="sectorFilter" class="filter-select" onchange="applyFilters()">
            <option value="">All Sectors</option>
            <option value="Public">Public</option>
            <option value="Private">Private</option>
        </select>

        <select id="locationFilter" class="filter-select" onchange="applyFilters()">
            <option value="">All Locations</option>
        </select>

        <select id="sortOrder" class="filter-select" onchange="applyFilters()">
            <option value="az">Sort: A-Z</option>
            <option value="za">Sort: Z-A</option>
            <option value="progs">Sort: Most Programs</option>
        </select>

        <button class="btn btn-refresh" onclick="fetchData()">
            <span class="material-icons-round">sync</span>
        </button>
    </div>

    <div id="universityGrid" class="grid"></div>
</div>

<div id="universityModal" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title" id="uniModalTitle">Add University</h3>
            <button class="close-btn" onclick="closeModal('universityModal')">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="uniId">
            <div class="form-group">
                <label class="form-label">University Name</label>
                <input type="text" id="uniName" class="form-control" placeholder="e.g. LUMS">
            </div>
            <div class="row-group">
                <div class="form-group" style="flex:1;">
                    <label class="form-label">Location</label>
                    <input type="text" id="uniLocation" class="form-control" placeholder="e.g. Lahore">
                </div>
                <div class="form-group" style="flex:1;">
                    <label class="form-label">Full Address</label>
                    <input type="text" id="uniAddress" class="form-control" placeholder="Detailed Address...">
                </div>
            </div>
            <div class="row-group">
                <div class="form-group" style="flex:1;">
                    <label class="form-label">Sector</label>
                    <select id="uniSector" class="form-control">
                        <option value="Public">Public</option>
                        <option value="Private">Private</option>
                    </select>
                </div>
                <div class="form-group" style="flex:1;">
                    <label class="form-label">Website URL</label>
                    <input type="text" id="uniWebsite" class="form-control" placeholder="https://...">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Logo Image URL</label>
                <input type="text" id="uniLogo" class="form-control" placeholder="https://example.com/logo.png">
            </div>
            <div class="row-group">
                <div class="form-group" style="flex:1;">
                    <label class="form-label">Phone</label>
                    <input type="text" id="uniPhone" class="form-control" placeholder="+92...">
                </div>
                <div class="form-group" style="flex:1;">
                    <label class="form-label">Email</label>
                    <input type="text" id="uniEmail" class="form-control" placeholder="info@...">
                </div>
            </div>
            <div style="margin-top: 20px;">
                <button class="btn btn-primary" style="width: 100%;" onclick="saveUniversity()">Save University Details</button>
            </div>
        </div>
    </div>
</div>

<div id="programsModal" class="modal-overlay">
    <div class="modal modal-lg">
        <div class="modal-header">
            <div>
                <h3 class="modal-title">Manage Programs</h3>
                <div style="font-size: 13px; color: var(--text-light); margin-top: 4px;">
                    For: <span id="currentUniName" style="color: var(--primary-blue); font-weight: 600;"></span>
                </div>
            </div>
            <button class="close-btn" onclick="closeModal('programsModal')">&times;</button>
        </div>
        <div class="modal-body">
            <div class="program-edit-box">
                <h4 style="margin: 0 0 15px 0; color: var(--charcoal); font-size: 15px;">Add / Edit Program</h4>
                <input type="hidden" id="progIndex">
                <div class="row-group prog-grid-row">
                    <div class="form-group" style="flex: 2;">
                        <label class="form-label">Program Name</label>
                        <input type="text" id="progName" class="form-control" placeholder="e.g. BS Computer Science">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">Min %</label>
                        <input type="number" id="progMerit" class="form-control" placeholder="60">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">Duration</label>
                        <input type="text" id="progDuration" class="form-control" placeholder="4 years">
                    </div>
                </div>
                <div class="row-group prog-grid-row">
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">Deadline</label>
                        <input type="text" id="progDeadline" class="form-control" placeholder="YYYY-MM-DD">
                    </div>
                    <div class="form-group" style="flex: 2;">
                        <label class="form-label">Stream Tags</label>
                        <input type="text" id="progTags" class="form-control" placeholder="IT, Engineering, Medical">
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 5px;">
                    <button class="btn btn-success" style="flex:1;" onclick="pushProgramToLocal()">
                        <span class="material-icons-round">add_circle</span> Add to List
                    </button>
                    <button class="btn btn-edit" onclick="clearProgramForm()">Clear</button>
                </div>
            </div>
            <h4 style="color: var(--charcoal); margin-bottom: 15px; font-size: 15px;">
                Current Programs <span id="progCount" style="color: var(--text-light); font-weight: normal;">(0)</span>
            </h4>
            <div id="programsListContainer" class="programs-list"></div>
        </div>
        <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid #EEE;">
            <button class="btn btn-primary" style="width: 100%;" onclick="commitProgramsToBackend()">
                <span class="material-icons-round">cloud_upload</span> Save All Changes to Cloud
            </button>
        </div>
    </div>
</div>

<script>
    // 🚨 CONFIG: Replace with your Render URL
    const API_BASE = "https://dakhla-unity-api.onrender.com/api/universities";

    let allUniversities = [];
    let currentUniForPrograms = null;
    let ADMIN_KEY = localStorage.getItem("dakhla_api_key");

    // --- Init ---
    window.onload = () => {
        if(ADMIN_KEY) {
            document.getElementById('authModal').classList.remove('show');
            fetchData();
        } else {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }
    };

    function saveApiKey() {
        const input = document.getElementById('apiKeyInput').value;
        if(!input) return alert("Please enter key");
        localStorage.setItem("dakhla_api_key", input);
        ADMIN_KEY = input;
        document.getElementById('authModal').classList.remove('show');
        fetchData();
    }

    function logout() {
        localStorage.removeItem("dakhla_api_key");
        location.reload();
    }

    async function fetchData() {
        document.getElementById('loadingOverlay').classList.remove('hidden');
        try {
            const res = await fetch(API_BASE);
            if (!res.ok) throw new Error("Fetch failed");
            allUniversities = await res.json();

            // Populate Location Dropdown automatically
            populateLocations(allUniversities);

            applyFilters(); // Initial render
        } catch (err) {
            console.error(err);
            alert("Error fetching data. Check server.");
        }
        document.getElementById('loadingOverlay').classList.add('hidden');
    }

    // --- Dynamic Filter Population ---
    function populateLocations(data) {
        const locSelect = document.getElementById('locationFilter');
        const uniqueLocs = [...new Set(data.map(u => u.location ? u.location.trim() : "").filter(l => l !== ""))].sort();

        // Keep first option "All Locations"
        locSelect.innerHTML = '<option value="">All Locations</option>';
        uniqueLocs.forEach(loc => {
            locSelect.innerHTML += `<option value="${loc}">${loc}</option>`;
        });
    }

    // --- MAIN FILTER & SORT LOGIC ---
    function applyFilters() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const sector = document.getElementById('sectorFilter').value;
        const location = document.getElementById('locationFilter').value;
        const sortBy = document.getElementById('sortOrder').value;

        // 1. Filter
        let filtered = allUniversities.filter(u => {
            const matchesSearch = u.name.toLowerCase().includes(query) || (u.location && u.location.toLowerCase().includes(query));
            const matchesSector = sector === "" || (u.sector && u.sector === sector);
            const matchesLocation = location === "" || (u.location && u.location.trim() === location);
            return matchesSearch && matchesSector && matchesLocation;
        });

        // 2. Sort
        if (sortBy === 'az') {
            filtered.sort((a, b) => a.name.localeCompare(b.name));
        } else if (sortBy === 'za') {
            filtered.sort((a, b) => b.name.localeCompare(a.name));
        } else if (sortBy === 'progs') {
            filtered.sort((a, b) => (b.programs?.length || 0) - (a.programs?.length || 0));
        }

        renderGrid(filtered);
    }

    // --- Render ---
    function renderGrid(data) {
        const grid = document.getElementById('universityGrid');
        grid.innerHTML = "";
        if (data.length === 0) {
            grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-light);">No data found matching filters.</div>`;
            return;
        }
        data.forEach(uni => {
            const badgeClass = (uni.sector && uni.sector.toLowerCase() === 'public') ? 'badge-public' : 'badge-private';
            const progCount = uni.programs ? uni.programs.length : 0;
            const cardHTML = `
                    <div class="card">
                        <div class="card-header">
                            <h3 class="uni-name">${uni.name}</h3>
                            <span class="badge ${badgeClass}">${uni.sector || 'Unknown'}</span>
                        </div>
                        <div class="uni-meta">
                            <div><span class="material-icons-round icon">place</span> ${uni.location}</div>
                            <div><span class="material-icons-round icon">school</span> ${progCount} Programs</div>
                        </div>
                        <div class="card-actions">
                            <button class="btn btn-card btn-purple" onclick='openProgramsModal("${uni.id}")'><span class="material-icons-round" style="font-size:16px;">list</span> Programs</button>
                            <button class="btn btn-card btn-edit" onclick='openEditUniModal("${uni.id}")'>Edit</button>
                            <button class="btn btn-card btn-delete" onclick='deleteUniversity("${uni.id}")'>Delete</button>
                        </div>
                    </div>`;
            grid.innerHTML += cardHTML;
        });
    }

    // --- Helper: Send Request with Key ---
    async function sendRequest(url, method, body) {
        try {
            const options = { method: method, headers: { "x-api-key": ADMIN_KEY } };
            if (method !== "DELETE") {
                options.headers["Content-Type"] = "application/json";
                options.body = JSON.stringify(body);
            }
            const safeUrl = url;
            const res = await fetch(safeUrl, options);
            if(res.status === 403) { alert("⛔ Access Denied: Invalid Key."); return false; }
            if(!res.ok) { const txt = await res.text(); alert(`Server Error: ${txt}`); return false; }
            return true;
        } catch(e) { alert("Network Error"); return false; }
    }

    // --- University CRUD ---
    function openUniversityModal() { document.getElementById('uniModalTitle').innerText = "Add University"; clearUniForm(); openModal('universityModal'); }
    function openEditUniModal(id) {
        const uni = allUniversities.find(u => u.id === id); if (!uni) return;
        document.getElementById('uniModalTitle').innerText = "Edit University";
        document.getElementById('uniId').value = uni.id;
        document.getElementById('uniName').value = uni.name;
        document.getElementById('uniLocation').value = uni.location;
        document.getElementById('uniAddress').value = uni.address || "";
        document.getElementById('uniSector').value = uni.sector;
        document.getElementById('uniWebsite').value = uni.websiteUrl;
        document.getElementById('uniPhone').value = uni.contactPhone || "";
        document.getElementById('uniEmail').value = uni.contactEmail || "";
        document.getElementById('uniLogo').value = uni.logoUrl || "";
        openModal('universityModal');
    }
    function clearUniForm() {
        document.getElementById('uniId').value = ""; document.getElementById('uniName').value = "";
        document.getElementById('uniLocation').value = ""; document.getElementById('uniAddress').value = "";
        document.getElementById('uniWebsite').value = ""; document.getElementById('uniPhone').value = "";
        document.getElementById('uniEmail').value = ""; document.getElementById('uniLogo').value = "";
    }
    async function saveUniversity() {
        const id = document.getElementById('uniId').value;
        const name = document.getElementById('uniName').value;
        if (!name) { alert("Name required"); return; }
        const generatedId = name.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') + "-" + Date.now().toString().slice(-4);
        const uniObj = {
            name, location: document.getElementById('uniLocation').value,
            address: document.getElementById('uniAddress').value,
            sector: document.getElementById('uniSector').value, websiteUrl: document.getElementById('uniWebsite').value,
            contactPhone: document.getElementById('uniPhone').value, contactEmail: document.getElementById('uniEmail').value,
            logoUrl: document.getElementById('uniLogo').value,
            programs: id ? allUniversities.find(u => u.id === id).programs : [],
            id: id || generatedId
        };
        const success = await sendRequest(id ? `${API_BASE}/${id}` : API_BASE, id ? "PUT" : "POST", uniObj);
        if (success) { closeModal('universityModal'); fetchData(); }
    }
    async function deleteUniversity(id) {
        if (!confirm("Delete this university?")) return;
        const success = await sendRequest(`${API_BASE}/${id}`, "DELETE", null);
        if (success) { alert("Deleted."); fetchData(); }
    }

    // --- Programs Logic ---
    function openProgramsModal(uniId) {
        currentUniForPrograms = JSON.parse(JSON.stringify(allUniversities.find(u => u.id === uniId)));
        if (!currentUniForPrograms) return;
        document.getElementById('currentUniName').innerText = currentUniForPrograms.name;
        renderProgramsList(); clearProgramForm(); openModal('programsModal');
    }
    function renderProgramsList() {
        const c = document.getElementById('programsListContainer'); c.innerHTML = "";
        const list = currentUniForPrograms.programs || [];
        document.getElementById('progCount').innerText = `(${list.length})`;
        if (list.length === 0) { c.innerHTML = "<div style='text-align:center; padding:20px; color:#888;'>No programs.</div>"; return; }
        list.forEach((p, i) => {
            const tags = p.streamTags ? p.streamTags.map(t => `<span class="tag-pill">${t}</span>`).join('') : '';
            c.innerHTML += `
                    <div class="program-item">
                        <div class="program-info">
                            <h4>${p.name}</h4>
                            <p>Min: <b>${p.minRequiredPercentage}%</b> | ${p.duration || ''} | ${p.applicationDeadline || ''}</p>
                            <div style="margin-top:5px;">${tags}</div>
                        </div>
                        <div class="prog-actions">
                            <button class="btn-icon btn-edit-icon" onclick="loadProgramIntoForm(${i})"><span class="material-icons-round" style="font-size:18px;">edit</span></button>
                            <button class="btn-icon btn-delete-icon" onclick="removeProgram(${i})"><span class="material-icons-round" style="font-size:18px;">close</span></button>
                        </div>
                    </div>`;
        });
    }
    function loadProgramIntoForm(i) {
        const p = currentUniForPrograms.programs[i];
        document.getElementById('progIndex').value = i;
        document.getElementById('progName').value = p.name;
        document.getElementById('progMerit').value = p.minRequiredPercentage;
        document.getElementById('progDuration').value = p.duration;
        document.getElementById('progDeadline').value = p.applicationDeadline;
        document.getElementById('progTags').value = p.streamTags ? p.streamTags.join(', ') : "";
    }
    function clearProgramForm() {
        document.getElementById('progIndex').value = "-1";
        document.getElementById('progName').value = ""; document.getElementById('progMerit').value = "";
        document.getElementById('progDuration').value = ""; document.getElementById('progDeadline').value = "";
        document.getElementById('progTags').value = "";
    }
    function pushProgramToLocal() {
        const idx = parseInt(document.getElementById('progIndex').value);
        const name = document.getElementById('progName').value;
        if (!name) { alert("Name required"); return; }
        const p = {
            programId: idx >= 0 ? currentUniForPrograms.programs[idx].programId : `prog-${Date.now()}`,
            name, minRequiredPercentage: parseFloat(document.getElementById('progMerit').value) || 0,
            duration: document.getElementById('progDuration').value, applicationDeadline: document.getElementById('progDeadline').value,
            streamTags: document.getElementById('progTags').value.split(',').map(t=>t.trim()).filter(t=>t)
        };
        if (idx >= 0) currentUniForPrograms.programs[idx] = p;
        else { if(!currentUniForPrograms.programs) currentUniForPrograms.programs=[]; currentUniForPrograms.programs.push(p); }
        renderProgramsList(); clearProgramForm();
    }
    function removeProgram(i) { if(!confirm("Remove program?")) return; currentUniForPrograms.programs.splice(i, 1); renderProgramsList(); }
    async function commitProgramsToBackend() {
        const btn = document.querySelector('#programsModal .btn-primary');
        const originalText = btn.innerHTML; btn.innerHTML = "Saving...";
        const success = await sendRequest(`${API_BASE}/${currentUniForPrograms.id}`, "PUT", currentUniForPrograms);
        btn.innerHTML = originalText;
        if (success) { closeModal('programsModal'); fetchData(); }
    }

    // --- Utils ---
    function openModal(id) { document.getElementById(id).classList.add('show'); document.getElementById(id).style.display='flex'; }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); setTimeout(()=>document.getElementById(id).style.display='none', 300); }
    window.onclick = function(e) { if(e.target.classList.contains('modal-overlay')) { e.target.classList.remove('show'); setTimeout(()=>e.target.style.display='none', 300); } }
</script>
</body>
